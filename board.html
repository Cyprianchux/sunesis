<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Slides | Sunesis</title>
    <link
      rel="icon"
      href="images/sunesisIcon.png"
      type="image/png"
      sizes="512x512"
    />
    <link rel="stylesheet" href="all.css" />
    <link rel="stylesheet" href="board.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="top-banner">
      <div class="top-left">
        <img src="images/sunesisBG2.png" alt="Image" />
        <h1><span>Su</span><span>ne</span>sis</h1>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search..." />
        <button id="searchBtn">
          <i class="fa-solid fa-magnifying-glass-arrow-right"></i>
        </button>
      </div>

      <div class="top-right">
        <ul class="nav-links" id="navLinks">
          <li>
            <a
              href="account.html"
              data-tooltip="Home page"
              aria-label="Home page"
              ><i class="fa-solid fa-house-user"></i
            ></a>
          </li>
          <li>
            <a
              href="web-view.html"
              data-tooltip="Web view"
              aria-label="Web view"
              ><i class="fa-solid fa-tv"></i
            ></a>
          </li>
          <li>
            <a
              href="slide-admin.html"
              data-tooltip="Manage slides"
              aria-label="Manage slides"
              >Setup</a
            >
          </li>
          <li id="topicsMenu" class="topics-menu">
            Topics
            <div class="topics-dropdown">
              <select id="topicSelect">
                <option value="">Choose a topic</option>
              </select>
            </div>
          </li>
          <li>
            <a
              href="#"
              onclick="
                logout();
                return false;
              "
              >Logout</a
            >
          </li>
        </ul>
        <button class="nav-toggle" onclick="menuToggle()">☰</button>
      </div>
    </div>

    <main>
      <div class="board-wrapper">
        <!-- DISPLAY BOARD -->
        <div class="board-screen" id="boardScreen">
          <p class="board-placeholder" id="boardPlaceholder">
            Start typing below...
          </p>
        </div>

        <!-- CONTROLS -->
        <div class="board-controls">
          <textarea
            id="boardInput"
            placeholder="Type here..."
            rows="2"
          ></textarea>

          <div class="board-buttons">
            <button id="addBoardBtn">
              <i class="fa-solid fa-plus"></i> Enter
            </button>

            <button id="deleteLastBtn">
              <i class="fa-solid fa-delete-left"></i> Delete Last
            </button>

            <button id="clearAllBtn">
              <i class="fa-solid fa-trash"></i> Clear All
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="backend-client.js"></script>
    <script src="sunesis.js"></script>
    <script src="board.js"></script>
  </body>
</html>
