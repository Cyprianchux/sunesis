<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunesis | Verify Email</title>

    <link rel="icon" href="./images/sunesisIcon.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/email-actions.css" />
  </head>

  <body>
    <div class="state-card">
      <a class="state-brand" href="/" aria-label="Sunesis home">
        <img src="./images/sunesisIcon.png" alt="" />
        <span>sunesis</span>
      </a>

      <div id="verifyLoading">
        <div class="state-icon loading">
          <i class="fa-solid fa-envelope-open-text"></i>
        </div>
        <h1>Verifying your email</h1>
        <p>Please wait while we confirm your email address...</p>
      </div>

      <div id="verifySuccess" class="hidden">
        <div class="state-icon success">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <h1>Email verified</h1>
        <p>
          Your email has been confirmed. You can now sign in to your workspace.
        </p>
        <p>
          <a class="state-link" href="/"
            >Sign in <i class="fa-solid fa-arrow-right"></i
          ></a>
        </p>
      </div>

      <div id="verifyError" class="hidden">
        <div class="state-icon error">
          <i class="fa-solid fa-circle-xmark"></i>
        </div>
        <h1>Verification failed</h1>
        <p id="verifyErrorMessage">
          This verification link is invalid or has expired.
        </p>
        <p>
          <a class="state-link" href="/">Back to login</a>
        </p>
      </div>
    </div>

    <script src="../js/api-client.js"></script>
    <script>
      (async function () {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (!token) {
          document.getElementById("verifyLoading").classList.add("hidden");
          document.getElementById("verifyError").classList.remove("hidden");
          document.getElementById("verifyErrorMessage").textContent =
            "Missing verification token.";
          return;
        }

        try {
          await window.remoteVerifyEmail(token);
          document.getElementById("verifyLoading").classList.add("hidden");
          document.getElementById("verifySuccess").classList.remove("hidden");
          setTimeout(() => {
            window.location.href = "/";
          }, 2500);
        } catch (error) {
          document.getElementById("verifyLoading").classList.add("hidden");
          document.getElementById("verifyError").classList.remove("hidden");
          document.getElementById("verifyErrorMessage").textContent =
            error.message;
        }
      })();
    </script>
  </body>
</html>
