<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account 1 | Sunesis</title>
  <link rel="stylesheet" href="slide-view.css">
  <link rel="stylesheet" href="account.css">

</head>
<body>

  <div class="top-banner">
    <div class="top-left">
      <img src="images/sunesisBG_cropped.png" alt="Image">
      <h1><span>Su</span><span>ne</span>sis</h1>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search...">
      <button id="searchBtn"><i class="fa-solid fa-magnifying-glass-arrow-right"></i></button>
    </div>

    <div class="top-right">
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html"><i class="fa-solid fa-house-user"></i></a></li>
        <li><a href="slide-admin.html">Manage-Slides</a></li>
        <li id="topicsMenu" class="topics-menu">
          Topics
          <div class="topics-dropdown">
            <select id="topicSelect">
              <option value="">Choose a topic</option>
            </select>
          </div>
        </li>
      </ul>
      <button class="nav-toggle" onclick="menuToggle()">☰</button>
    </div>
  </div>

  <div class="banner">
    <h1>Welcome, Account 1</h1>
    <p>Select a topic to continue</p>
    <button class="back-btn" onclick="window.location.href='index.html'">← Back to Accounts</button>
  </div>

  <div class="topics-container">
    <div class="topic-card">
      <h3>Biomedical Presentation</h3>
      <button onclick="goTo('slide-view.html')">View</button>
    </div>

    <div class="topic-card">
      <h3>Medical Devices</h3>
      <button onclick="goTo('sunesis.html?topic=medical')">View</button>
    </div>

    <div class="topic-card">
      <h3>Health Research</h3>
      <button onclick="goTo('sunesis.html?topic=research')">View</button>
    </div>
  </div>

  <script>
    function goTo(page) {
      window.location.href = page;
    }
  </script>

</body>
</html>
